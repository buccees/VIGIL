name: Spatial Core CI

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "spatial-core/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/spatial-core.yml"
  pull_request:
    paths:
      - "spatial-core/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/spatial-core.yml"

permissions:
  contents: read

jobs:
  test:
    name: Build and test Spatial Core
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Run tests
        run: gradle test
